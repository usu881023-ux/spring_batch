spring:
  # 운영 DB 설정 (DS_PRVA)
  datasource:
    prva:
      jdbc-url: ${DB_PRVA_URL}
      username: ${DB_PRVA_USERNAME}
      password: ${DB_PRVA_PASSWORD}
      driver-class-name: oracle.jdbc.OracleDriver
      hikari:
        maximum-pool-size: 20
        minimum-idle: 10
        connection-timeout: 30000
        idle-timeout: 600000
        max-lifetime: 1800000
        pool-name: HikariCP-PRVA-PROD

    # 운영 DB 설정 (DS_MALL)
    mall:
      jdbc-url: ${DB_MALL_URL}
      username: ${DB_MALL_USERNAME}
      password: ${DB_MALL_PASSWORD}
      driver-class-name: oracle.jdbc.OracleDriver
      hikari:
        maximum-pool-size: 20
        minimum-idle: 10
        connection-timeout: 30000
        idle-timeout: 600000
        max-lifetime: 1800000
        pool-name: HikariCP-MALL-PROD

  # JPA 설정
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect
        default_schema: PRVA_PROD

# Logging 설정
logging:
  level:
    root: INFO
    com.company.hcbatch: INFO
    org.springframework.batch: INFO
    org.hibernate.SQL: WARN
  file:
    name: /app/batch/logs/hc-batch.log
    max-size: 50MB
    max-history: 90
