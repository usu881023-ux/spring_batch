plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.0-M1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.company'
version = '1.0.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
    maven { url 'https://repo.spring.io/milestone' }  // Spring Milestone Repository
}

ext {
    // 버전 관리
    lombokVersion = '1.18.38'
    querydslVersion = '5.1.0'
    oracleVersion = '23.6.0.24.10'
}

dependencies {
    // Spring Boot Starters
    implementation 'org.springframework.boot:spring-boot-starter-batch'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // MyBatis (Spring Boot 4.0 호환)
    implementation 'org.mybatis:mybatis:3.5.16'
    implementation 'org.mybatis:mybatis-spring:3.0.4'

    // JSON
    implementation 'com.googlecode.json-simple:json-simple:1.1.1'

    // Apache Commons
    implementation 'org.apache.commons:commons-lang3:3.14.0'

    // 외부 JAR - 암복호화 라이브러리
    implementation files('lib/bcipher-1.0.5.jar')

    // AWS SDK v2 (S3)
    implementation platform('software.amazon.awssdk:bom:2.25.0')
    implementation 'software.amazon.awssdk:s3'

    // Database - Oracle
    implementation "com.oracle.database.jdbc:ojdbc11:${oracleVersion}"
    implementation "com.oracle.database.jdbc:ucp:${oracleVersion}"

    // QueryDSL - Jakarta
    implementation "com.querydsl:querydsl-jpa:${querydslVersion}:jakarta"
    annotationProcessor "com.querydsl:querydsl-apt:${querydslVersion}:jakarta"
    annotationProcessor 'jakarta.persistence:jakarta.persistence-api:3.2.0'

    // Lombok (annotation processor 순서 중요 - 제일 먼저)
    compileOnly "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"

    // Test용 Lombok
    testCompileOnly "org.projectlombok:lombok:${lombokVersion}"
    testAnnotationProcessor "org.projectlombok:lombok:${lombokVersion}"

    // Spring Boot Configuration Processor
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    // Test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.batch:spring-batch-test'
    testImplementation 'com.h2database:h2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

// Java 컴파일 옵션 (Java 25)
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += [
            '-parameters',
            '--enable-preview'  // Java 25 preview features
    ]
}

// 네이티브 라이브러리 경로 (bcipher DLL/SO)
def nativeLibPath = file("${projectDir}/lib").absolutePath

// Java 실행 옵션 (Java 25 preview features)
tasks.withType(JavaExec).configureEach {
    jvmArgs += ['--enable-preview']
    systemProperty 'bcipher.library.path', nativeLibPath
}

tasks.withType(Test).configureEach {
    jvmArgs += ['--enable-preview']
    systemProperty 'bcipher.library.path', nativeLibPath
}

// QueryDSL 설정
def querydslDir = layout.buildDirectory.dir("generated/querydsl").get().asFile

sourceSets {
    main {
        java {
            srcDirs += [querydslDir]
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.getGeneratedSourceOutputDirectory().set(file(querydslDir))
}

clean {
    delete querydslDir
}

// Bootable JAR 설정
tasks.named('bootJar') {
    archiveBaseName = 'hc_job_batch'
    archiveVersion = '1.0.0-SNAPSHOT'
    enabled = true
}

// Plain JAR 비활성화
tasks.named('jar') {
    enabled = false
}
